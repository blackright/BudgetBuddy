name: Flutter Validation

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-validate:
    name: Build and Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pin the version used for the approved green baseline. Tracking
          # `stable` changes Dart between local runs and CI overnight.
          flutter-version: '3.47.7'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Build Runner (Code Generation)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Code
        run: flutter analyze

      - name: Run Functional Tests
        run: >
          flutter test
          --exclude-tags performance
          --reporter expanded
          --timeout 120s
          --file-reporter json:functional-results.json

      - name: Run Performance Tests
        run: >
          flutter test
          test/features/expenses/expense_search_native_test.dart
          --tags performance
          --concurrency=1
          --reporter expanded
          --timeout 120s
          --file-reporter json:performance-results.json

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            functional-results.json
            performance-results.json
          if-no-files-found: ignore

